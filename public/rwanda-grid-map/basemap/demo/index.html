<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iwacu Rwanda — ikarita y'imbibi z'imidugudu</title>
  <link rel="stylesheet" href="../vendor/maplibre-gl.css" />
  <script src="../vendor/maplibre-gl.js"></script>
  <script src="../vendor/pmtiles.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    #bar { position: absolute; z-index: 2; left: 8px; right: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    #bar button { border: 0; border-radius: 8px; padding: 8px 12px; background: #20603d; color: #fff; font-size: 14px; box-shadow: 0 1px 5px #0003; }
    #map-status { position: absolute; z-index: 2; top: 54px; left: 8px; right: 8px; max-width: 620px; background: rgba(255,255,255,.95); color: #17492d; padding: 7px 10px; border-radius: 8px; font-size: 12px; line-height: 1.35; box-shadow: 0 1px 5px #0002; }
    #attr { position: absolute; z-index: 2; left: 8px; bottom: 8px; right: 8px; background: rgba(255,255,255,.94); padding: 6px 8px; border-radius: 6px; font-size: 11px; line-height: 1.35; }
  </style>
</head>
<body>
  <div id="bar">
    <button type="button" id="btn-kigali">Kigali</button>
    <button type="button" id="btn-kivu">Nyamasheke / Kivu</button>
    <button type="button" id="btn-musanze">Musanze</button>
  </div>
  <div id="map-status" role="status" aria-live="polite">Turimo gufungura ikarita n'imbibi z'imidugudu...</div>
  <div id="map"></div>
  <div id="attr">
    © OpenStreetMap contributors · ODbL ·
    © OpenMapTiles · Map data from Geofabrik Rwanda extract ·
    Imbibi z'imidugudu: Iwacu Rwanda database ·
    MapLibre GL · PMTiles · Noto Sans (SIL OFL 1.1)
  </div>
  <script>
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);
    const base = new URL("..", window.location.href).href.replace(/\/$/, "");
    const tilesUrl = base + "/rwanda.pmtiles";
    const glyphs = base + "/vendor/fonts/{fontstack}/{range}.pbf";
    const emptyCollection = { type: "FeatureCollection", features: [] };
    const status = document.getElementById("map-status");
    const style = {
      version: 8,
      sources: { protomaps: { type: "vector", url: "pmtiles://" + tilesUrl, attribution: "© OpenStreetMap · © OpenMapTiles" } },
      glyphs,
      layers: [
        { id: "bg", type: "background", paint: { "background-color": "#f0f4f0" } },
        { id: "landcover", type: "fill", source: "protomaps", "source-layer": "landcover", paint: { "fill-color": "#c6ddb0", "fill-opacity": 0.55 } },
        { id: "landuse", type: "fill", source: "protomaps", "source-layer": "landuse", paint: { "fill-color": "#d5e8c8", "fill-opacity": 0.4 } },
        { id: "water", type: "fill", source: "protomaps", "source-layer": "water", paint: { "fill-color": "#7eb6d9" } },
        { id: "waterway", type: "line", source: "protomaps", "source-layer": "waterway", paint: { "line-color": "#7eb6d9", "line-width": 1 } },
        { id: "buildings", type: "fill", source: "protomaps", "source-layer": "building", minzoom: 13, paint: { "fill-color": "#c9c4b8", "fill-opacity": 0.7 } },
        { id: "roads", type: "line", source: "protomaps", "source-layer": "transportation", paint: { "line-color": "#f0c27a", "line-width": ["interpolate", ["linear"], ["zoom"], 8, 0.8, 14, 3] } },
        { id: "places", type: "symbol", source: "protomaps", "source-layer": "place",
          layout: { "text-field": ["coalesce", ["get", "name"], ""], "text-size": 12, "text-font": ["Noto Sans Regular"] },
          paint: { "text-color": "#222", "text-halo-color": "#fff", "text-halo-width": 1.2 } }
      ]
    };
    const map = new maplibregl.Map({ container: "map", style, center: [30.06, -1.95], zoom: 12 });
    map.addControl(new maplibregl.NavigationControl(), "bottom-right");

    let boundaryController = null;
    let boundaryRefreshTimer = null;
    let lastBoundaryCount = 0;

    map.on("load", () => {
      map.addSource("iwacu-villages", { type: "geojson", data: emptyCollection });
      map.addLayer({
        id: "iwacu-village-fill",
        type: "fill",
        source: "iwacu-villages",
        minzoom: 10,
        paint: { "fill-color": "#4b9b64", "fill-opacity": 0.07 }
      });
      map.addLayer({
        id: "iwacu-village-outline",
        type: "line",
        source: "iwacu-villages",
        minzoom: 10,
        paint: {
          "line-color": "#175c36",
          "line-opacity": 0.92,
          "line-width": ["interpolate", ["linear"], ["zoom"], 10, 1, 13, 1.6, 17, 2.4]
        }
      });
      map.addLayer({
        id: "iwacu-village-labels",
        type: "symbol",
        source: "iwacu-villages",
        minzoom: 13,
        layout: {
          "symbol-placement": "point",
          "text-field": ["coalesce", ["get", "name_kiny"], ["get", "village"], ["get", "name_eng"], ""],
          "text-font": ["Noto Sans Regular"],
          "text-size": ["interpolate", ["linear"], ["zoom"], 13, 9, 16, 11, 18, 12],
          "text-max-width": 10,
          "text-allow-overlap": true,
          "text-ignore-placement": true,
          "text-optional": true
        },
        paint: {
          "text-color": "#123c25",
          "text-halo-color": "#fff",
          "text-halo-width": 1.4,
          "text-halo-blur": 0.2
        }
      });

      const refreshVillageBoundaries = async () => {
        if (!map.getSource("iwacu-villages")) return;
        if (map.getZoom() < 10) {
          status.textContent = "Kwegera ku ikarita kugira ngo ubone imbibi z'imidugudu.";
          return;
        }
        const bounds = map.getBounds();
        const west = bounds.getWest();
        const south = bounds.getSouth();
        const east = bounds.getEast();
        const north = bounds.getNorth();
        if (east - west > 0.5 || north - south > 0.5) {
          status.textContent = "Agace ureba ni kanini cyane. Kwegera (zoom) kugira ngo imbibi zigaragare neza.";
          return;
        }

        if (boundaryController) boundaryController.abort();
        boundaryController = new AbortController();
        const query = new URLSearchParams({
          west: String(west), south: String(south), east: String(east), north: String(north)
        });
        status.textContent = "Turimo kuzana imbibi z'imidugudu n'amazina yayo...";
        try {
          const response = await fetch("/api/location-map?" + query.toString(), {
            signal: boundaryController.signal,
            cache: "no-store"
          });
          if (!response.ok) throw new Error("village_boundary_fetch_failed");
          const collection = await response.json();
          if (!map.getSource("iwacu-villages")) return;
          const features = Array.isArray(collection.features) ? collection.features : [];
          map.getSource("iwacu-villages").setData(collection);
          lastBoundaryCount = features.length;
          if (lastBoundaryCount >= 1200) {
            status.textContent = "Imbibi " + lastBoundaryCount + "+ zigaragara. Kwegera kurushaho kugira ngo ubone n'utundi duce tw'imidugudu.";
          } else if (lastBoundaryCount > 0) {
            status.textContent = "Imbibi z'imidugudu zigaragara: " + lastBoundaryCount + ". Amazina agaragara iyo wegereye (zoom 13+).";
          } else {
            status.textContent = "Nta mbibi z'imidugudu zabonetse muri aka gace; gerageza kwegera cyangwa uhitemo ahandi.";
          }
        } catch (error) {
          if (error && error.name === "AbortError") return;
          status.textContent = "Imbibi ntizafungutse ubu. Ongera ugerageze nyuma yo kwegera ku ikarita.";
        }
      };

      const scheduleBoundaryRefresh = () => {
        if (boundaryRefreshTimer) clearTimeout(boundaryRefreshTimer);
        boundaryRefreshTimer = setTimeout(refreshVillageBoundaries, 320);
      };
      map.on("moveend", scheduleBoundaryRefresh);
      scheduleBoundaryRefresh();

      map.on("click", "iwacu-village-fill", (event) => {
        const feature = event.features && event.features[0];
        const props = feature && feature.properties ? feature.properties : {};
        const name = props.name_kiny || props.village || props.name_eng || "Umudugudu";
        new maplibregl.Popup({ closeButton: true, closeOnClick: true })
          .setLngLat(event.lngLat)
          .setHTML("<strong>" + String(name).replace(/[&<>"]/g, (ch) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[ch])) + "</strong>")
          .addTo(map);
      });
      map.on("mouseenter", "iwacu-village-fill", () => { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", "iwacu-village-fill", () => { map.getCanvas().style.cursor = ""; });
    });

    document.getElementById("btn-kigali").onclick = () => map.flyTo({ center: [30.06, -1.95], zoom: 13 });
    document.getElementById("btn-kivu").onclick = () => map.flyTo({ center: [29.10, -2.30], zoom: 12 });
    document.getElementById("btn-musanze").onclick = () => map.flyTo({ center: [29.63, -1.50], zoom: 13 });
    window.addEventListener("beforeunload", () => {
      if (boundaryController) boundaryController.abort();
      if (boundaryRefreshTimer) clearTimeout(boundaryRefreshTimer);
    });
  </script>
</body>
</html>
