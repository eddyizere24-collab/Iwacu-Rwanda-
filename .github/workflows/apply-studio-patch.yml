name: Apply studio unify patch
on:
  workflow_dispatch:
  push:
    branches: [studio/unify]
    paths: [.github/trigger-apply-studio-patch]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/unify
          fetch-depth: 0
      - name: Assemble and apply patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f scripts/.tmp/studio-patch-part-aa ]; then echo missing parts; exit 1; fi
          cat scripts/.tmp/studio-patch-part-a* > /tmp/studio-unify.patch
          git apply --index /tmp/studio-unify.patch || git apply --3way /tmp/studio-unify.patch
          git add -A
          git status
          git commit -m "[GROK] map+cal+sw: apply staged studio/unify patch - MapLibre PMTiles calibration-v2 sw v4" || echo nothing
          git push origin HEAD:studio/unify
          rm -rf scripts/.tmp
          git add -A && git commit -m "[GROK] cleanup tmp patch parts" && git push origin HEAD:studio/unify || true
