name: verify-kigali
on:
  push:
    branches: [verify/kigali]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser run on a throttled phone
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE"/scripts/verify/*.mjs /tmp/pw/ && cd /tmp/pw && node ${RUN_SCRIPT:-plan-run.mjs}
      - name: Publish screenshots to a branch
        if: always()
        run: |
          cd /tmp/pw && rm -rf shots-repo && mkdir shots-repo && cp *.png shots-repo/ 2>/dev/null || true
          cd shots-repo && git init -q && git checkout -q -b verify-shots && git add . && git -c user.name=ci -c user.email=ci@example.com commit -q -m shots && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" verify-shots
