name: Leader Registry V2 database contract
on:
  push:
    branches:
      - feature/leaders-registry-v2
  pull_request:
    branches:
      - main
    paths:
      - "sql/migrations/20261103_leader_registry_v2_foundation.sql"
      - "supabase/tests/**"
      - ".github/workflows/leader-registry-v2-db.yml"
permissions:
  contents: read
jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iwacu_registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iwacu_registry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: iwacu_registry_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build isolated baseline
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/leader_registry_v2_bootstrap.sql
      - name: Apply additive schema to isolated database only
        run: psql -v ON_ERROR_STOP=1 -f sql/migrations/20261103_leader_registry_v2_foundation.sql
      - name: Run database and RLS workflow contract tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/leader_registry_v2_contract.test.sql
