name: Leader Registry V2 + L1 database contract
on:
  push:
    branches:
      - feature/leaders-registry-v2
      - feature/m2-db
      - feature/m3-office
      - feature/m4-workspaces
  pull_request:
    branches:
      - main
    paths:
      - "sql/migrations/**"
      - "sql/rollbacks/**"
      - "supabase/tests/**"
      - ".github/workflows/leader-registry-v2-db.yml"
permissions:
  contents: read
jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iwacu_registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iwacu_registry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: iwacu_registry_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build isolated baseline
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/leader_registry_v2_bootstrap.sql
      - name: Apply V2 foundation to isolated PostgreSQL only
        run: psql -v ON_ERROR_STOP=1 -f sql/migrations/20261103_leader_registry_v2_foundation.sql
      - name: Apply L1 dossier and position catalogue migration
        run: psql -v ON_ERROR_STOP=1 -f sql/migrations/20261104_01_leader_registry_dossier_and_positions.sql
      - name: Apply L1 transfer and public candidate migration
        run: psql -v ON_ERROR_STOP=1 -f sql/migrations/20261104_02_leader_registry_transfer_and_public_candidates.sql
      - name: Apply L1 Storage buckets and policies
        run: psql -v ON_ERROR_STOP=1 -f sql/migrations/20261104_03_leader_registry_storage.sql
      - name: Apply L1 appointment end/archive RPC
        run: psql -v ON_ERROR_STOP=1 -f sql/migrations/20261104_04_leader_appointment_archive.sql
      - name: Apply L1 admin authority SQLSTATE 42501
        run: psql -v ON_ERROR_STOP=1 -f sql/migrations/20261104_05_admin_authority_sqlstate.sql
      - name: Apply L1 hardening of default table privileges
        run: psql -v ON_ERROR_STOP=1 -f sql/migrations/20261104_06_harden_default_table_privileges.sql
      - name: Apply L1 boundaries id/parent_id column SELECT
        run: psql -v ON_ERROR_STOP=1 -f sql/migrations/20261104_07_boundaries_id_parent_select.sql
      - name: Apply public verified_at and citizen feedback migration
        run: psql -v ON_ERROR_STOP=1 -f sql/migrations/20261105_01_public_verified_at_and_feedback.sql
      - name: Apply M3 office accounts and messages migration
        run: psql -v ON_ERROR_STOP=1 -f sql/migrations/20261107_01_office_accounts_and_messages.sql
      - name: Apply M4 office workspaces migration
        run: psql -v ON_ERROR_STOP=1 -f sql/migrations/20261109_01_office_workspaces.sql
      - name: Apply M4b office oversight migration
        run: psql -v ON_ERROR_STOP=1 -f sql/migrations/20261109_02_office_oversight.sql
      - name: Run V2 database and RLS contract tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/leader_registry_v2_contract.test.sql
      - name: Run L1 transfer, archive, Storage and public privacy contracts
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/leader_registry_v2_l1_contract.test.sql
      - name: Run public verified_at and citizen feedback contracts
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/leader_registry_v2_m2_contract.test.sql
      - name: Run M3 office accounts and messages contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/office_m3_contract.test.sql
      - name: Run M4 office workspaces contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/office_m4_contract.test.sql
      - name: Run M4b office oversight contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/office_m4b_contract.test.sql
      - name: Explain the bounded public candidate lookup (no geometry)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/leader_directory_explain.sql
