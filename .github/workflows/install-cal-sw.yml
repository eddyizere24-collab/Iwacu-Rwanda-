name: Install calibration-v2
on:
  workflow_dispatch:
  push:
    branches: [studio/unify]
    paths: [.github/trigger-install-cal]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/unify
          fetch-depth: 0
      - name: Install calibration-v2 and exact backoff from known SHAs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin wip/p4-results fix/consolidation-build
          git show origin/wip/p4-results:results/calibration-v2.json > src/lib/calibration-v2.json
          test "$(git hash-object src/lib/calibration-v2.json)" = "79bcb7fc7dcefa6d310ef5939e6f1d7a0220762d"
          git show origin/fix/consolidation-build:src/lib/backoff.ts > /tmp/b.ts
          sed -i 's|import calibrationConfig from "./calibration-v1.json";|import calibrationConfig from "./calibration-v2.json"; // CHANGED 2026-11-03 GROK: wire calibration-v2; keep v1 for rollback|' /tmp/b.ts
          cp /tmp/b.ts src/lib/backoff.ts
          git show origin/fix/consolidation-build:public/sw.js > /tmp/sw.js
          sed -i 's|const CACHE_VERSION = "iwacu-v3-representative-points";|const CACHE_VERSION = "iwacu-v4-own-basemap";|' /tmp/sw.js
          python3 - <<'PY'
          from pathlib import Path
          t = Path('/tmp/sw.js').read_text()
          old = '''self.addEventListener("fetch", (event) => {
            const { request } = event;
            const url = new URL(request.url);

            if (request.method !== "GET" || url.origin !== self.location.origin) {
              return;
            }
          '''
          # fix whitespace to match file
          t2 = t
          needle = 'self.addEventListener("fetch", (event) => {'
          if 'rwanda-grid-map' not in t2:
              idx = t2.find(needle)
              if idx < 0: raise SystemExit('fetch missing')
              insert = '''self.addEventListener("fetch", (event) => {
            const { request } = event;
            const url = new URL(request.url);

            // CHANGED 2026-11-03 GROK: do not intercept basemap tiles or Range requests (PMTiles needs 206)
            if (url.pathname.startsWith("/rwanda-grid-map/") || request.headers.has("range")) {
              return;
            }

            if (request.method !== "GET" || url.origin !== self.location.origin) {
              return;
            }
          '''
              # simpler: line-based insert after url =
              lines = t2.splitlines(True)
              out=[]
              i=0
              while i < len(lines):
                  out.append(lines[i])
                  if 'const url = new URL(request.url);' in lines[i] and i+1 < len(lines) and 'rwanda-grid-map' not in t2:
                      out.append('\n')
                      out.append('  // CHANGED 2026-11-03 GROK: do not intercept basemap tiles or Range requests (PMTiles needs 206)\n')
                      out.append('  if (url.pathname.startsWith("/rwanda-grid-map/") || request.headers.has("range")) {\n')
                      out.append('    return;\n')
                      out.append('  }\n')
                  i+=1
              Path('/tmp/sw.js').write_text(''.join(out))
          else:
              Path('/tmp/sw.js').write_text(t2)
          PY
          cp /tmp/sw.js public/sw.js
          git add src/lib/calibration-v2.json src/lib/backoff.ts public/sw.js
          git commit -m "[GROK] cal+sw: calibration-v2 blob 79bcb7fc + exact backoff import + sw v4 - WIP"
          git push origin HEAD:studio/unify
