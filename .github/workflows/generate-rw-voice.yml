name: Generate Kinyarwanda voice
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate phrase audio
        run: node scripts/generate-rw-voice.mjs
      - name: Push audio to a branch
        if: always()
        run: |
          git config user.name "iwacu-voice-bot"
          git config user.email "voice-bot@users.noreply.github.com"
          git checkout -b "voice/rw-phrases-${GITHUB_RUN_ID}"
          git add public/voice/rw
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Add stored Kinyarwanda phrase audio"
          git push origin "voice/rw-phrases-${GITHUB_RUN_ID}"
