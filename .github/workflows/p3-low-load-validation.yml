name: P3 low-load locate validation

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: "Type buexgewxypvkqmphvfec to confirm the only allowed database"
        required: false
        default: ""
        type: string
  push:
    branches:
      - wip/p3-protect
    paths:
      - .github/workflows/p3-low-load-validation.yml

permissions:
  contents: write

concurrency:
  group: p3-low-load-validation
  cancel-in-progress: false

jobs:
  low-load-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      matrix:
        worker: [single]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      CONFIRM_PROJECT: ${{ inputs.confirm_project || '' }}
      EXPECTED_PROJECT_URL: https://buexgewxypvkqmphvfec.supabase.co
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout P3 source
        uses: actions/checkout@v4
        with:
          ref: wip/p3-protect
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Confirm the only allowed Supabase project
        shell: bash
        run: |
          set -euo pipefail
          test "$NEXT_PUBLIC_SUPABASE_URL" = "$EXPECTED_PROJECT_URL" || {
            echo "Refusing: Supabase URL is not the explicitly allowed project." >&2
            exit 1
          }
          if [ -n "$CONFIRM_PROJECT" ]; then
            test "$CONFIRM_PROJECT" = "buexgewxypvkqmphvfec" || {
              echo "Refusing: project confirmation input does not match." >&2
              exit 1
            }
          fi
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || {
            echo "Refusing: NEXT_PUBLIC_SUPABASE_ANON_KEY repository secret is missing." >&2
            exit 1
          }
          echo "Confirmed project ref buexgewxypvkqmphvfec; secret values hidden."

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Run plain JavaScript low-load validator
        run: node scripts/p3-low-load-runner.mjs

      - name: Commit results to workflow-free branch wip/p3-results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp
          if [ ! -s /tmp/p3-low-load-results.json ]; then
            printf '{"workflow":"P3 low-load locate validation","outcome":"NOT_RUN","source_sha":"%s","reason":"Validation did not produce a result file."}\n' "$GITHUB_SHA" > /tmp/p3-low-load-results.json
          fi
          git fetch origin wip/p3-results
          git worktree add --detach /tmp/p3-results-worktree origin/wip/p3-results
          mkdir -p /tmp/p3-results-worktree/results
          cp /tmp/p3-low-load-results.json /tmp/p3-results-worktree/results/p3-low-load.json
          git -C /tmp/p3-results-worktree config user.name "github-actions[bot]"
          git -C /tmp/p3-results-worktree config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/p3-results-worktree add results/p3-low-load.json
          if git -C /tmp/p3-results-worktree diff --cached --quiet; then
            echo "Result file unchanged; no result commit was needed."
          else
            git -C /tmp/p3-results-worktree commit -m "Update P3 low-load validation results"
            git -C /tmp/p3-results-worktree push origin HEAD:wip/p3-results
          fi
          echo "Updated results on workflow-free branch wip/p3-results using a clean detached worktree."
