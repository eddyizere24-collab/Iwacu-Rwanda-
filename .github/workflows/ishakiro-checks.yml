name: Ishakiro assistant checks

on:
  push:
    branches:
      - feature/ishakiro-part-1-continuation-20261109
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/assistant/**"
      - "src/components/AiSearchAssistant.tsx"
      - "src/app/api/ai-router/route.ts"
      - "src/app/api/ishakiro/route.ts"
      - "src/app/page.tsx"
      - "package.json"
      - ".github/workflows/ishakiro-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ishakiro-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-public-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Bun from packageManager
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Report regenerated Bun lockfile diff
        if: always()
        run: |
          if ! git diff --quiet -- bun.lock; then
            echo "BUN_LOCKFILE_DIFF_BEGIN"
            git diff --no-ext-diff -- bun.lock
            echo "BUN_LOCKFILE_DIFF_END"
          else
            echo "Bun lockfile unchanged."
          fi
      - name: Ishakiro 100+ question intent evaluation
        run: npm run test:assistant
      - name: Existing location and UI contract tests
        run: npm run test:location
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build (no deploy)
        run: npm run build
