name: verify-answer-store
on:
  push:
    branches: [verify/answer-store]
permissions: {}
jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the live assistant
        run: |
          ask() {
            curl -sS -m 30 -X POST https://iwacu-rwanda-2.vercel.app/api/ishakiro \
              -H 'content-type: application/json' \
              -d "{\"query\":\"$1\"}" -w '\n[%{http_code} %{time_total}s]\n' | cut -c1-700
          }
          echo "--- 1 insult"; ask "Uri igicucu cyane kandi nta cyo ukora"
          echo "--- 2 distress"; ask "Ndarambiwe rwose numva ntakibasha kugenda neza mu buzima bwanjye"
          echo "--- 3 english"; ask "Explain how vaccines protect children from disease"
          echo "--- 4 new rw"; ask "Mbwira uko ubuhinzi bw'ikawa bukorwa neza"
