name: verify-answer-store
on:
  push:
    branches: [verify/answer-store]
permissions: {}
jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: Search timings
        run: |
          B=https://iwacu-rwanda-2.vercel.app
          for q in gasabo gasabo kacyiru gihanga musanze; do
            echo "--- $q"; curl -sS -m 30 "$B/api/ikarita/search?q=$q" -w '\n[%{http_code} %{time_total}s]\n' | cut -c1-300
          done
