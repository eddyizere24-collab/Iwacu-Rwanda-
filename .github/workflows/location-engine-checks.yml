name: Location engine checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/never-fail-location-engine, fix/mobile-data-location-20261107, fix/location-map-overlay-rpc-timeout-releasebase-20261112]

permissions:
  contents: read

concurrency:
  group: location-engine-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-public-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Bun from packageManager
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install
      - name: Report regenerated Bun lockfile diff
        if: always()
        run: |
          if ! git diff --quiet -- bun.lock; then
            echo "BUN_LOCKFILE_DIFF_BEGIN"
            git diff --no-ext-diff -- bun.lock
            echo "BUN_LOCKFILE_DIFF_END"
          else
            echo "Bun lockfile unchanged."
          fi
      - name: ESLint
        run: npm run lint
      - name: Location and locate-protection unit tests (mocked RPC)
        run: npm run test:location
      - name: Accuracy rejection static gate
        run: npm run check:no-accuracy-rejections
      - name: Accuracy rejection JavaScript guard
        run: npm run check:no-accuracy-rejection
      - name: TypeScript type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
