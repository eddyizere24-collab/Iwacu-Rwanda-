name: Fix backoff exact
on:
  workflow_dispatch:
  push:
    branches: [studio/unify]
    paths: [.github/trigger-fix-backoff]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/unify
      - name: Write exact backoff
        run: |
          python3 -c "import pathlib,base64; pathlib.Path('src/lib/backoff.ts').write_bytes(base64.b64decode(pathlib.Path('scripts/.tmp/backoff.b64').read_text()))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/backoff.ts
          git commit -m "[GROK] cal: exact backoff.ts only import line change - WIP" || exit 0
          git push origin HEAD:studio/unify
