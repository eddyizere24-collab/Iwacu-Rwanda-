name: Verify UI
on:
  push:
    branches: ['verify/ui-*']
permissions:
  contents: write
jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --legacy-peer-deps 2>&1 | tail -2
      - name: Temporary page that holds only the picker
        run: |
          mkdir -p src/app/verify-picker
          cat > src/app/verify-picker/page.tsx <<'TSX'
          "use client";
          import { VillagePicker } from "@/components/VillagePicker";
          export default function Page() {
            return <main className="p-3"><VillagePicker onSelect={(code) => { (window as unknown as { __picked: string }).__picked = code; }} /></main>;
          }
          TSX
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
        run: npx next build 2>&1 | tail -25
      - name: Start
        run: |
          nohup npx next start -p 3100 > start.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:3100/verify-picker > /dev/null && break; sleep 1; done
          curl -s -o /dev/null -w "page %{http_code}\n" http://localhost:3100/verify-picker
          curl -s "http://localhost:3100/api/administrative-units/search?q=gihembe" | head -c 300; echo
      - name: Browser
        run: |
          npm install --prefix /tmp/pw playwright --no-audit --no-fund 2>&1 | tail -1
          npx --prefix /tmp/pw playwright install --with-deps chromium 2>&1 | tail -1
          node scripts/verify/picker-run.mjs
      - name: Keep the pictures
        if: always()
        run: |
          git config user.name "verify-bot"; git config user.email "verify-bot@users.noreply.github.com"
          git checkout -q -b "verify/shots-${GITHUB_RUN_ID}"
          git add -f shots
          git commit -q -m "shots" && git push -q origin "verify/shots-${GITHUB_RUN_ID}"
