# CHANGED 2026-11-03 GROK: real offline validate; working-directory national-grid/integrate3
name: grid/offline_validate
on:
  workflow_dispatch:
    inputs:
      district:
        description: "District id (e.g. 11) or all-smoke"
        default: "11"
concurrency:
  group: grid-offline-val-real
  cancel-in-progress: false
jobs:
  one-district:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: national-grid/integrate3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely
      - name: Ensure geojson
        run: |
          if [ ! -f data/rwanda_villages_full.geojson ]; then
            python scripts/download_nisr_geometry.py
          fi
      - name: Generate points SEED-TUNE and SEED-TEST
        run: |
          D="${{ github.event.inputs.district || '11' }}"
          python scripts/offline_validate_district.py --district "$D" --seed 424242
          python scripts/offline_validate_district.py --district "$D" --seed 20261030
          ls -lh artifacts/offline_val/
          for f in artifacts/offline_val/*; do echo "=== $f ==="; head -c 1500 "$f"; echo; done
      - uses: actions/upload-artifact@v4
        with:
          name: offline-val-${{ github.event.inputs.district || '11' }}
          path: national-grid/integrate3/artifacts/offline_val/
