# CHANGED 2026-11-03 GROK: real parity 100k + 10k PIP; working-directory national-grid/integrate3
name: grid/offline_parity
on:
  workflow_dispatch:
concurrency:
  group: grid-parity-real
  cancel-in-progress: false
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: national-grid/integrate3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely pygeohash pyproj numpy
      - name: Ensure geojson and grid artifacts
        run: |
          if [ ! -f data/rwanda_villages_full.geojson ]; then
            python scripts/download_nisr_geometry.py
          fi
          # Prefer existing exact_out; else build 4-district subset for parity
          if [ ! -d artifacts/exact_out ]; then
            python - <<'PY'
            import json
            from pathlib import Path
            with open("data/rwanda_villages_full.geojson") as f:
                fc = json.load(f)
            keep = {"11", "12", "13", "37"}
            fc["features"] = [ft for ft in fc["features"] if str(ft["properties"].get("district_id")) in keep]
            Path("data/rwanda_4d.geojson").write_text(json.dumps(fc))
            print("features", len(fc["features"]))
            PY
            python scripts/build_exact_grid.py --geojson data/rwanda_4d.geojson --out artifacts/exact_out
          fi
      - name: Run offline parity workflow body if present
        run: |
          if [ -f .github/workflows/offline_parity.yml ]; then
            echo "Nested offline_parity.yml present; executing parity scripts from it is embedded below"
          fi
          # Delegate to nested script logic: 100k parity if script exists
          if [ -f scripts/offline_parity.py ]; then
            python scripts/offline_parity.py --n 100000 --out artifacts/parity_report.json
          elif [ -f scripts/check_parity.py ]; then
            python scripts/check_parity.py --n 100000 --out artifacts/parity_report.json
          else
            echo "NO_PARITY_SCRIPT"
            ls scripts/ | head -50
            exit 1
          fi
          cat artifacts/parity_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-parity-reports
          path: national-grid/integrate3/artifacts/
          retention-days: 14
