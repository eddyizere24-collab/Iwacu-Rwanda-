name: Consolidate IWACU source repositories

on:
  push:
    branches:
      - consolidation/iwacu-rwanda-20261102
    paths:
      - .github/workflows/consolidate-source-repositories.yml

permissions:
  contents: write

concurrency:
  group: iwacu-rwanda-consolidation
  cancel-in-progress: false

jobs:
  import-repositories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v4
        with:
          ref: consolidation/iwacu-rwanda-20261102
          fetch-depth: 0

      - name: Install Git subtree
        run: |
          if ! git subtree -h >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y git-subtree
          fi

      - name: Fetch both source repositories and preserve their branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add iwacu_original https://github.com/eddyizere24-collab/Iwacu-rwanda-.git
          git remote add iwacu_grid https://github.com/eddyizere24-collab/iwacu-rwanda-grid.git

          git fetch --no-tags iwacu_original '+refs/heads/*:refs/remotes/iwacu_original/*'
          git fetch --no-tags iwacu_grid '+refs/heads/*:refs/remotes/iwacu_grid/*'

          while IFS= read -r ref; do
            branch="${ref#refs/remotes/iwacu_original/}"
            git push origin "${ref}:refs/heads/import/iwacu-rwanda-original/${branch}"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/iwacu_original/)

          while IFS= read -r ref; do
            branch="${ref#refs/remotes/iwacu_grid/}"
            git push origin "${ref}:refs/heads/import/iwacu-rwanda-grid/${branch}"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/iwacu_grid/)

      - name: Import original IWACU repository into the monorepo
        run: |
          set -euo pipefail
          git subtree add --prefix=legacy/iwacu-rwanda-original/main iwacu_original main --squash
          git subtree add --prefix=legacy/iwacu-rwanda-original/stage1-clean iwacu_original stage1-clean --squash

      - name: Import national grid and Rwanda map assets
        run: |
          set -euo pipefail
          git subtree add --prefix=national-grid/main iwacu_grid main --squash
          git subtree add --prefix=national-grid/results iwacu_grid results --squash
          git subtree add --prefix=public/rwanda-grid-map iwacu_grid gh-pages --squash

      - name: Push consolidated repository branch
        run: git push origin HEAD:consolidation/iwacu-rwanda-20261102
