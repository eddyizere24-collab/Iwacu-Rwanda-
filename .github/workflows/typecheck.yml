name: Typecheck
on:
  push:
    branches: ['verify/types-*']
jobs:
  types:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --legacy-peer-deps 2>&1 | tail -3
      - name: Types
        run: npx tsc --noEmit
      - name: Tests
        run: npm run test:location
