name: Create fix/main-recovery

on:
  workflow_dispatch:
  push:
    branches:
      - fix/consolidation-build
    paths:
      - .github/trigger-main-recovery

permissions:
  contents: write

concurrency:
  group: main-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verify parent of 2f66a3dc is aba940e
        run: |
          set -euo pipefail
          PARENT=$(git rev-parse 2f66a3dcd88cab4831af3d5ff4653427c0ef7a08^)
          echo "parent=$PARENT"
          test "$PARENT" = "aba940ecdb57351bb1ac45d219314fbb0dce281d"

      - name: Create fix/main-recovery with one revert
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B fix/main-recovery origin/main
          git revert --no-edit 2f66a3dcd88cab4831af3d5ff4653427c0ef7a08
          HEAD_TREE=$(git rev-parse HEAD^{tree})
          GOOD_TREE=$(git rev-parse aba940ecdb57351bb1ac45d219314fbb0dce281d^{tree})
          echo "HEAD_TREE=$HEAD_TREE"
          echo "GOOD_TREE=$GOOD_TREE"
          test "$HEAD_TREE" = "$GOOD_TREE"
          echo "HEAD=$(git rev-parse HEAD)"
          git push -u origin fix/main-recovery --force-with-lease || git push -u origin fix/main-recovery
